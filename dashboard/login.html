<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Log in — PRX</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/prx-icon.svg" />
    <style>
      /* ── Minimal subset of the dashboard's design tokens ─────────
         Only the values used on this page; mirrors dashboard/src/index.css.
         IBM Plex Sans (body) + Hanken Grotesk (heading) loaded here —
         keeps the login bundle small. Files are served from the
         shared/fonts symlink under the dashboard's public/ root. */
      @font-face {
        font-family: "IBM Plex Sans";
        font-style: normal;
        font-weight: 100 700;
        font-display: swap;
        src: url("/fonts/ibm-plex-sans/IBMPlexSans-Variable--latin_basic.woff2") format("woff2");
      }
      @font-face {
        font-family: "Hanken Grotesk";
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url("/fonts/hanken-grotesk/HankenGrotesk-Variable--latin_basic.woff2") format("woff2");
      }

      :root {
        --color-canvas: #f8f8fc;
        --color-canvas-light: #ffffff;
        --color-navy: #2b2650;
        --color-navy-100: #e2e0f0;
        --color-navy-900: #0e0c1e;
        --color-rust: #6538d8;
        --color-rust-700: #5329b5;
        --color-text: #1b1930;
        --color-text-muted: #55526c;
        --color-text-subtle: #706c88;
        --color-danger: #c0343f;
        --font-sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
        --font-display: "Hanken Grotesk", system-ui, sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--color-canvas);
        color: var(--color-text);
        font: 14px/1.5 var(--font-sans);
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px;
      }

      .logo {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--color-text);
      }
      .logo img {
        width: 36px;
        height: 36px;
      }
      .logo .name {
        font: 650 30px/1 var(--font-display);
        letter-spacing: -0.02em;
      }
      .logo .by {
        font:
          500 10.5px/1.4 "IBM Plex Mono",
          ui-monospace,
          monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--color-text-subtle);
        padding-left: 10px;
        border-left: 1px solid var(--color-navy-100);
      }

      form {
        background: var(--color-canvas-light);
        border: 1px solid var(--color-navy-100);
        border-radius: 14px;
        box-shadow: 0 24px 48px -32px rgba(14, 12, 30, 0.35);
        padding: 24px;
        width: 100%;
        max-width: 360px;
      }

      h1 {
        font-family: var(--font-display);
        font-size: 32px;
        font-weight: 600;
        letter-spacing: -0.025em;
        margin: 0 0 16px;
        color: var(--color-text);
        line-height: 1.1;
      }

      label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--color-navy);
        margin: 0 0 6px;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border: 1px solid var(--color-navy-100);
        border-radius: 8px;
        background: var(--color-canvas-light);
        color: var(--color-text);
        font: 14px/1.5 var(--font-sans);
        outline: none;
      }

      input:focus {
        outline: 2px solid var(--color-rust);
        outline-offset: 2px;
      }

      button {
        margin-top: 16px;
        width: 100%;
        padding: 8px 16px;
        background: var(--color-rust);
        color: #fff;
        border: 0;
        border-radius: 10px;
        font: 14px/1.5 var(--font-sans);
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }

      button:hover {
        background: var(--color-rust-700);
      }

      button:focus-visible {
        outline: 2px solid var(--color-rust);
        outline-offset: 2px;
      }

      .err {
        color: var(--color-danger);
        font-size: 12px;
        margin: 0 0 12px;
      }

      .hint {
        color: var(--color-text-muted);
        font-size: 13px;
        margin: 0 0 16px;
      }
    </style>
  </head>

  <body>
    <span class="logo" role="img" aria-label="PRX by Nebuless">
      <img src="/prx-icon.svg" alt="" />
      <span class="name">PRX</span>
      <span class="by">Nebuless</span>
    </span>
    <form method="POST" action="/__login?next={{.Next}}">
      {{if .FirstRun}}
      <h1>Set dashboard password</h1>
      <p class="hint">
        PRX has no operator yet. Pick a password — it will be required to reach the dashboard and
        the management API from now on.
      </p>
      {{if .Error}}
      <p class="err">{{.Error}}</p>
      {{end}}
      <label for="password">New password</label>
      <input id="password" type="password" name="password" autofocus required minlength="12" />
      <label for="confirm">Confirm password</label>
      <input id="confirm" type="password" name="confirm" required minlength="12" />
      <button type="submit">Set password</button>
      {{else}}
      <h1>Log in</h1>
      {{if .Error}}
      <p class="err">{{.Error}}</p>
      {{end}}
      <label for="password">Password</label>
      <input id="password" type="password" name="password" autofocus required />
      <button type="submit">Unlock</button>
      {{end}}
    </form>
  </body>
</html>
