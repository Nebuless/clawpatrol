name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "version tag (e.g. v0.1.0)"
        required: true
        default: "dev"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { os: linux,  arch: amd64 }
          - { os: linux,  arch: arm64 }
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: build dashboard
        run: |
          cd dashboard
          deno install
          deno task build

      - name: build nebprx
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p out
          version="${TAG#v}"
          go build \
            -ldflags "-s -w -X main.buildVersion=${version} -X main.buildGitSHA=${SHA}" \
            -trimpath \
            -o out/nebprx-${{ matrix.os }}-${{ matrix.arch }} ./cmd/nebprx

      - uses: actions/upload-artifact@v4
        with:
          name: nebprx-${{ matrix.os }}-${{ matrix.arch }}
          path: out/nebprx-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 7

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: create checksums
        run: |
          cd artifacts
          sha256sum nebprx-* > SHA256SUMS

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            artifacts/nebprx-* \
            artifacts/SHA256SUMS
