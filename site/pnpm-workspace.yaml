packages:
  - .

allowBuilds:
  fsevents: true
  esbuild: true
  sharp: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20261030.1"
  - miniflare@5.20261023.3-beta
